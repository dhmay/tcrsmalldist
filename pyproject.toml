[project]
name = "tcrsmalldist"
version = "0.1.0"
description = "A calibrated same-peptide probability for TCR pairs that TCRdist calls close"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.scripts]
tcrsmalldist = "tcrsmalldist.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcrsmalldist"]
