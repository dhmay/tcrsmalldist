[project]
name = "tcrsmalldist"
version = "0.1.0"
description = "A calibrated same-peptide probability score for TCR pairs with TCRdist <= 24"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Damon May" }]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/dhmay/tcrsmalldist"
Source = "https://github.com/dhmay/tcrsmalldist"

[project.scripts]
tcrsmalldist = "tcrsmalldist.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcrsmalldist"]
